name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 src/ api/ --max-line-length=120 --extend-ignore=E203,W503

      - name: Check that core modules import cleanly
        run: |
          python -c "from src.preprocessing import data_import, data_split"
          python -c "from src.Feature_engineering import build_preprocessing_pipeline, get_low_iv_columns, drop_columns"
          python -c "from src.train import build_pipeline, get_top_n_configs"
          python -c "from src.evaluate import gini_coefficient, plot_ks, cross_validation"